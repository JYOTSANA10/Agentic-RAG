version: '3.8'

services:
  it-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-it-copilot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-it-copilot}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-company-it-kb}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    volumes:
      - copilot-data:/app/packages/backend/prisma
      - copilot-uploads:/app/packages/backend/uploads

volumes:
  copilot-data:
  copilot-uploads:

